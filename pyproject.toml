[project]
name = "esas-bot"
version = "0.1.0"
description = "Telegram Bot for E-Scooter Service Center"
requires-python = ">=3.10"
dependencies = [
    "aiogram>=3.4.1",
    "python-dotenv>=1.0.1",
    "sqlalchemy[asyncio]>=2.0.27",
    "aiosqlite>=0.20.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0",
    "aiohttp>=3.9.0",
    "gspread>=6.0.0",
    "google-auth>=2.0.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["bot*", "partner_bot*"]
