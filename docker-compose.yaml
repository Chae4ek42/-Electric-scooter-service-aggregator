name: esas

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=esas
      - POSTGRES_USER=esas
      - POSTGRES_PASSWORD=esas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esas -d esas"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  client-bot:
    build: .
    command: python -m client_bot
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=Europe/Moscow
      - DATABASE_URL=postgresql+asyncpg://esas:esas@postgres:5432/esas
      - LOG_FORMAT=text
      - LOG_LEVEL=INFO
      - LOG_DIR=/app/data/logs
      - LOG_FILE_MAX_MB=30
      - LOG_FILE_BACKUPS=5
      - METRICS_PORT=9101
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
      - ./service-account-key.json:/app/service-account-key.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  partner-bot:
    build: .
    command: python -m partner_bot
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=Europe/Moscow
      - DATABASE_URL=postgresql+asyncpg://esas:esas@postgres:5432/esas
      - LOG_FORMAT=text
      - LOG_LEVEL=INFO
      - LOG_DIR=/app/data/logs
      - LOG_FILE_MAX_MB=30
      - LOG_FILE_BACKUPS=5
      - METRICS_PORT=9102
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
      - ./service-account-key.json:/app/service-account-key.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  sync-service:
    build: .
    command: python -m sync_service
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=Europe/Moscow
      - DATABASE_URL=postgresql+asyncpg://esas:esas@postgres:5432/esas
      - LOG_FORMAT=text
      - LOG_LEVEL=INFO
      - LOG_DIR=/app/data/logs
      - LOG_FILE_MAX_MB=30
      - LOG_FILE_BACKUPS=5
      - METRICS_PORT=9103
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
      - ./service-account-key.json:/app/service-account-key.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      client-bot:
        condition: service_started
      partner-bot:
        condition: service_started
      sync-service:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:
  postgres_data:
