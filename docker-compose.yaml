services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  client-bot:
    build: .
    command: python -m client_bot
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=Europe/Moscow
      - LOG_FORMAT=text
      - LOG_LEVEL=INFO
      - LOG_DIR=/app/data/logs
      - LOG_FILE_MAX_MB=30
      - LOG_FILE_BACKUPS=5
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
      - ./service-account-key.json:/app/service-account-key.json:ro
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  partner-bot:
    build: .
    command: python -m partner_bot
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=Europe/Moscow
      - LOG_FORMAT=text
      - LOG_LEVEL=INFO
      - LOG_DIR=/app/data/logs
      - LOG_FILE_MAX_MB=30
      - LOG_FILE_BACKUPS=5
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
      - ./service-account-key.json:/app/service-account-key.json:ro
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  sync-service:
    build: .
    command: python -m sync_service
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=Europe/Moscow
      - LOG_FORMAT=text
      - LOG_LEVEL=INFO
      - LOG_DIR=/app/data/logs
      - LOG_FILE_MAX_MB=30
      - LOG_FILE_BACKUPS=5
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
      - ./service-account-key.json:/app/service-account-key.json:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:
