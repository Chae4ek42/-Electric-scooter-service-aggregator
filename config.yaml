# Инфраструктура
redis_url: "redis://redis:6379/0"
# Для Docker production задавайте DATABASE_URL через env
database_url: "sqlite+aiosqlite:///data/esas.db"

# Контакты поддержки
support_user: "@i_jusp" #Техподдержка
cooperation_user: "@sergzvezdilin" #Нетехническая поддержка

# Администраторы (без @)
admin_usernames:
    - "i_jusp"
    - "chae4ek42"
    - "sergzvezdilin"

# Google Sheets — путь к JSON-ключу Service Account
google_sa_path: "service-account-key.json"

# Google Sheets
sheets:
    sync_interval: 20 # legacy-параметр (full sync теперь event-driven)
    tab_services: "Сервисы"
    tab_orders: "Заявки"
    tab_clients: "Клиенты"
    tab_bank_details: "Реквизиты"
    tab_service_metrics: "Метрики сервисов"
    columns:
        - "ID"
        - "Название"
        - "Телефон"
        - "Telegram"
        - "Адрес"
        - "Метро ближ."
        - "Специализация"
        - "Основной бренд самокатов"
        - "Категория"
        - "Открытие"
        - "Закрытие"
        - "Гидроизоляция"
        - "Цена гидроизоляции"
        - "Диагностика"
        - "Входит в стоимость"
        - "Категории апгрейда"
        - "Рабочие дни"
        - "Рейтинг Я.Карты"
        - "Статус"
        - "Доступен"
        - "Завершена"

# Календарь и слоты
calendar:
    days: 14 # дней вперёд в календаре
    work_hour_start: 8
    work_hour_end: 22
    time_slot_minutes: 60

# Антифлуд
throttle_rate: 0.2 # мин. интервал между запросами (сек)

# Подбор сервиса
matching:
    max_distance_km: 30

# FSM-напоминание о незавершённой
fsm_reminder:
    timeout: 1800 # секунды до напоминания (30 мин)
    check_interval: 60 # секунды между проверками
