# Инфраструктура
redis_url: "redis://redis:6379/0"
database_url: "sqlite+aiosqlite:///data/esas.db"
google_sa_path: "service-account-key.json"

# Контакты поддержки
support_user: "@i_jusp" #Техподдержка
cooperation_user: "@sergzvezdilin" #Не техническая поддержка

# Администраторы (без @)
admin_usernames:
    - "i_jusp"
    - "chae4ek42"
    - "sergzvezdilin"

# Google Sheets — путь к JSON-ключу Service Account
google_sa_path: "service-account-key.json"

# Google Sheets
sheets:
    sync_interval: 300 # секунды между синхронизациями
    tab_services: "Сервисы"
    tab_orders: "Заявки"
    tab_clients: "Клиенты"
    columns:
        - "Название"
        - "Рейтинг Я.Карты"
        - "Телефон"
        - "Telegram"
        - "Адрес"
        - "Метро ближ."
        - "Специализация"
        - "Основной бренд самокатов"
        - "Статус"
        - "Доступен"
        - "Категория"
        - "Открытие"
        - "Закрытие"
        - "Гидроизоляция"
        - "Цена гидроизоляции"
        - "Диагностика"
        - "Входит в стоимость"

# Календарь и слоты
calendar:
    days: 14 # дней вперёд в календаре
    work_hour_start: 8
    work_hour_end: 22
    time_slot_minutes: 60

# Антифлуд
throttle_rate: 0.2 # мин. интервал между запросами (сек)

# FSM-напоминание о незавершённой форме
fsm_reminder:
    timeout: 1800 # секунды до напоминания (30 мин)
    check_interval: 60 # секунды между проверками
