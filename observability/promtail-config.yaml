server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-json
    static_configs:
      - targets: [localhost]
        labels:
          job: docker-json
          __path__: /var/lib/docker/containers/*/*-json.log

    pipeline_stages:
      - docker: {}
      - json:
          expressions:
            level: level
            service: service
            logger: logger
            request_id: request_id
            user_id: user_id
            chat_id: chat_id
      - labels:
          level:
          service:
          logger:
          request_id:
          user_id:
          chat_id:
