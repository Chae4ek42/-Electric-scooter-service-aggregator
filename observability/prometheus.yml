global:
    scrape_interval: 15s
    evaluation_interval: 15s

rule_files:
    - /etc/prometheus/alerts.yml

scrape_configs:
    - job_name: client-bot
      static_configs:
          - targets: ["client-bot:9101"]

    - job_name: partner-bot
      static_configs:
          - targets: ["partner-bot:9102"]

    - job_name: sync-service
      static_configs:
          - targets: ["sync-service:9103"]
