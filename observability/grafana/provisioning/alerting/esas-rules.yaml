apiVersion: 1

groups:
    - orgId: 1
      name: ESAS Log Alerts
      folder: ESAS Alerts
      interval: 1m
      rules:
          - uid: esas_err_spike_srv
            title: ESAS errors spike per service
            condition: C
            data:
                - refId: A
                  queryType: instant
                  relativeTimeRange:
                      from: 300
                      to: 0
                  datasourceUid: loki
                  model:
                      datasource:
                          type: loki
                          uid: loki
                      editorMode: code
                      expr: sum by (service) (count_over_time({service=~"client-bot|partner-bot|sync-service", level="ERROR"}[5m]))
                      instant: true
                      intervalMs: 1000
                      maxDataPoints: 43200
                      queryType: instant
                      refId: A
                - refId: C
                  queryType: ""
                  relativeTimeRange:
                      from: 0
                      to: 0
                  datasourceUid: __expr__
                  model:
                      conditions:
                          - evaluator:
                                params:
                                    - 5
                                type: gt
                            operator:
                                type: and
                            query:
                                params:
                                    - A
                            reducer:
                                params: []
                                type: last
                            type: query
                      datasource:
                          type: __expr__
                          uid: __expr__
                      expression: A
                      intervalMs: 1000
                      maxDataPoints: 43200
                      refId: C
                      type: classic_conditions
            noDataState: NoData
            execErrState: Error
            for: 2m
            annotations:
                summary: "Service {{ $labels.service }} has >5 ERROR logs in 5 minutes"
            labels:
                severity: warning
                source: loki

          - uid: esas_err_spike_all
            title: ESAS total errors spike
            condition: C
            data:
                - refId: A
                  queryType: instant
                  relativeTimeRange:
                      from: 300
                      to: 0
                  datasourceUid: loki
                  model:
                      datasource:
                          type: loki
                          uid: loki
                      editorMode: code
                      expr: sum(count_over_time({service=~"client-bot|partner-bot|sync-service", level="ERROR"}[5m]))
                      instant: true
                      intervalMs: 1000
                      maxDataPoints: 43200
                      queryType: instant
                      refId: A
                - refId: C
                  queryType: ""
                  relativeTimeRange:
                      from: 0
                      to: 0
                  datasourceUid: __expr__
                  model:
                      conditions:
                          - evaluator:
                                params:
                                    - 20
                                type: gt
                            operator:
                                type: and
                            query:
                                params:
                                    - A
                            reducer:
                                params: []
                                type: last
                            type: query
                      datasource:
                          type: __expr__
                          uid: __expr__
                      expression: A
                      intervalMs: 1000
                      maxDataPoints: 43200
                      refId: C
                      type: classic_conditions
            noDataState: NoData
            execErrState: Error
            for: 2m
            annotations:
                summary: "Total ERROR logs across ESAS services >20 in 5 minutes"
            labels:
                severity: critical
                source: loki
